# Flatpak manifest for LinuxFiles (Files for Linux; based on Files by the Files Community).
#
# Repackages the self-contained publish tarball (scripts/linux/publish.sh --tarball), so the build needs
# neither the .NET SDK nor network access. Build with scripts/linux/build-flatpak.sh, or by hand:
#   scripts/linux/publish.sh --tarball
#   flatpak-builder --force-clean --repo=artifacts/flatpak-repo \
#       artifacts/flatpak-build packaging/linux/flatpak/io.github.memergamer.LinuxFiles.yml
# For a release build, replace the `path` source below with the url + sha256 of the GitHub release tarball.
app-id: io.github.memergamer.LinuxFiles
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: files

finish-args:
  - --env=FILES_DISABLE_ROOT_ACTIONS=1
  - --share=ipc
  # Uno Skia desktop is X11-only; Wayland sessions use XWayland.
  - --socket=x11
  - --device=dri
  # A file manager must see the whole filesystem (including other users' mount points under /run/media).
  - --filesystem=host
  # Network/MTP/removable locations mounted through gvfs (FUSE view and the session daemon).
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfs-fuse
  - --talk-name=org.gtk.vfs.*
  # Serves ShowFolders/ShowItems/ShowItemProperties so other apps can "show in folder".
  - --own-name=org.freedesktop.FileManager1
  # Saved network credentials (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # Mount/unmount/eject through UDisks2 on the system bus.
  - --system-talk-name=org.freedesktop.UDisks2
  # Desktop notifications for long operations.
  - --talk-name=org.freedesktop.Notifications
  # Deliberately absent: --talk-name=org.freedesktop.Flatpak (flatpak-spawn --host would void the sandbox).
  # Opening files in other apps goes through the xdg-desktop-portal OpenURI/OpenFile portals, which need no permission.

modules:
  - name: files
    buildsystem: simple
    build-commands:
      - tar -xzf files-linux-x64.tar.gz
      - mkdir -p /app/lib/linuxfiles && cp -a linux-x64/. /app/lib/linuxfiles/
      - rm -rf /app/lib/linuxfiles/elevation-helper && rm -f /app/lib/linuxfiles/files-elevation-helper
      - touch /app/lib/linuxfiles/.root-actions-disabled
      - install -Dm755 packaging/linux/files /app/bin/files
      - install -Dm644 packaging/linux/io.github.memergamer.LinuxFiles.desktop
        /app/share/applications/io.github.memergamer.LinuxFiles.desktop
      - sed -i 's/\r$//; /^\[Desktop Action root-mode\]/,$d; /^Actions=/s/root-mode;//'
        /app/share/applications/io.github.memergamer.LinuxFiles.desktop
      - install -Dm644 packaging/linux/io.github.memergamer.LinuxFiles.metainfo.xml
        /app/share/metainfo/io.github.memergamer.LinuxFiles.metainfo.xml
      - for s in 16 24 32 48 64 128 256 512; do
        install -Dm644 packaging/linux/icons/hicolor/${s}x${s}/apps/io.github.memergamer.LinuxFiles.png
        /app/share/icons/hicolor/${s}x${s}/apps/io.github.memergamer.LinuxFiles.png; done
    sources:
      # Produced by scripts/linux/publish.sh --tarball (top-level directory linux-x64/).
      - type: file
        path: ../../../artifacts/files-linux-x64.tar.gz
        dest-filename: files-linux-x64.tar.gz
      - type: dir
        path: ../../../packaging
        dest: packaging
